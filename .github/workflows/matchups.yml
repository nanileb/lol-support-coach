name: Counters et synergies (meilleurs joueurs, hebdomadaire)
on:
  schedule:
    - cron: '0 9 * * 3'   # chaque mercredi 9:00 UTC (après les builds du mardi), cumulé sur plusieurs patchs
  workflow_dispatch:
    inputs:
      matches:
        description: Nouvelles parties maximum
        default: '8000'
      days:
        description: Jours d'historique à parcourir (35 pour un rattrapage)
        default: '7'
permissions:
  contents: write
concurrency: riot   # même clé Riot que les builds : jamais en même temps
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/matchups.mjs ${{ github.event.inputs.matches || '8000' }}
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
      - run: |
          git config user.name "builds-bot"
          git config user.email "builds-bot@users.noreply.github.com"
          git add matchups.json data/lite.json.gz
          git diff --cached --quiet || git commit -m "Counters mis à jour (meilleurs joueurs EUW + KR)"
          git pull --rebase origin main && git push
